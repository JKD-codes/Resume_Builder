<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resumeit — Interview-ready resume builder</title>
  <meta name="description" content="Build an ATS-friendly, recruiter-approved resume in minutes. 12 professional templates, live preview, resume score, job-match keywords and PDF export.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M10 8h8l4 4v12H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M13 16h6M13 20h4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/resume.css">
  <style id="pageStyle"></style>
  <script>
    // Apply theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('rb:theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="app" id="app" data-mview="content">
    <header class="topbar">
      <div class="tb-left">
        <a class="brand" href="#" aria-label="Resumeit home">
          <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h4"/></svg></span>
          <span class="brand-name" id="brandName">Resumeit</span>
        </a>
        <span class="tb-sep"></span>
        <div class="menu-wrap">
          <button class="doc-btn" id="docBtn" aria-haspopup="true" title="Switch resume"><span id="docName">My resume</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="menu left" id="docMenu" role="menu"></div>
        </div>
        <span class="save-state hide-sm" id="saveState"><span class="dot"></span><span class="lbl-t">Saved</span></span>
      </div>
      <div class="tb-right">
        <button class="btn ghost hide-sm" id="tplBtn"></button>
        <div class="menu-wrap">
          <button class="btn ghost" id="exportBtn" aria-haspopup="true"></button>
          <div class="menu" id="exportMenu" role="menu"></div>
        </div>
        <button class="icon-btn hide-sm" id="themeBtn" title="Toggle dark mode"></button>
        <span id="proSlot"></span>
        <button class="btn primary dl" id="downloadBtn"></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel" id="panel">
        <nav class="panel-tabs" role="tablist" id="panelTabs"></nav>
        <div class="panel-body" id="panelBody">
          <section class="tab" id="tab-content"></section>
          <section class="tab" id="tab-design" hidden></section>
          <section class="tab" id="tab-review" hidden></section>
        </div>
      </aside>

      <main class="preview" id="preview" aria-label="Resume preview">
        <div class="preview-scroll" id="previewScroll">
          <div class="pages-frame" id="pagesFrame"><div class="pages" id="pages"></div></div>
        </div>
        <div class="zoombar" id="zoombar"></div>
      </main>
    </div>

    <nav class="mnav" id="mnav"></nav>
  </div>

  <div class="measure" id="measure" aria-hidden="true"></div>
  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="print-root" id="printRoot"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <input type="file" id="photoFile" accept="image/*" hidden>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/review.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
